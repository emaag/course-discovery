name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: wp-content/plugins/course-discovery

jobs:
  # Pure PHP, no WordPress involved — the fast gate the other two jobs wait on.
  quality:
    name: Unit tests + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: wp-content/plugins/course-discovery

      - run: composer test

      - run: composer stan

  # WP_UnitTestCase against a real WordPress core + MySQL — no container,
  # no live install needed: wp-phpunit only needs WP core files on disk
  # (for classes/functions) and a DB it installs its own tables into, and
  # this plugin's bootstrap requires ACF's files directly rather than via
  # a real "activation" — so both are just downloaded as flat files.
  integration:
    name: Integration tests (WP_UnitTestCase)
    runs-on: ubuntu-latest
    needs: quality
    env:
      WP_VERSION: "7.0.2"
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_ABSPATH: /tmp/wordpress-core/
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, mbstring, dom, curl, zip
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: wp-content/plugins/course-discovery

      - name: Download WordPress core + ACF (flat files, no install needed)
        run: |
          mkdir -p /tmp/wordpress-core
          curl -sSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wordpress.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C /tmp/wordpress-core --strip-components=1
          curl -sSL "https://downloads.wordpress.org/plugin/advanced-custom-fields.latest-stable.zip" -o /tmp/acf.zip
          unzip -q /tmp/acf.zip -d /tmp/wordpress-core/wp-content/plugins/
          ln -s "$GITHUB_WORKSPACE/wp-content/plugins/course-discovery" /tmp/wordpress-core/wp-content/plugins/course-discovery

      - run: composer test:integration

  # The full stack (docker compose), a real wp_install + ACF activation
  # via WP-CLI, seeded data, and a real Chromium against it — the layer
  # everything else in this suite exists to give confidence in.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: wp-content/plugins/course-discovery

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for WordPress to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null http://localhost:8080/wp-login.php; then
              echo "WordPress is up"
              exit 0
            fi
            sleep 2
          done
          echo "WordPress never came up" >&2
          docker compose logs wordpress
          exit 1

      - name: Install WP-CLI in the container
        run: |
          curl -sSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          docker compose cp /tmp/wp-cli.phar wordpress:/usr/local/bin/wp
          docker compose exec -T wordpress chmod +x /usr/local/bin/wp

      - name: Install WordPress, ACF, and activate the plugin/theme
        run: |
          docker compose exec -T wordpress wp core install --allow-root \
            --url=http://localhost:8080 \
            --title="Course Discovery CI" \
            --admin_user=admin \
            --admin_password=ci-only-not-a-secret \
            --admin_email=ci@example.test \
            --skip-email
          docker compose exec -T wordpress wp plugin install advanced-custom-fields --activate --allow-root
          docker compose exec -T wordpress wp plugin activate course-discovery --allow-root
          docker compose exec -T wordpress wp theme activate course-discovery-theme --allow-root

      - name: Seed demo data
        run: docker compose exec -T wordpress php wp-content/plugins/course-discovery/bin/seed.php

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/plugins/course-discovery/tests/e2e/package-lock.json

      - working-directory: wp-content/plugins/course-discovery/tests/e2e
        run: npm ci

      - working-directory: wp-content/plugins/course-discovery/tests/e2e
        run: npx playwright install --with-deps chromium

      - working-directory: wp-content/plugins/course-discovery/tests/e2e
        run: npm run test:e2e

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: wp-content/plugins/course-discovery/tests/e2e/playwright-report/
          retention-days: 7
